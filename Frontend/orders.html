
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeliverIQ | Orders</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .orders-section {
            margin-top: 30px;
            background: #151d2d;
            padding: 25px;
            border-radius: 12px;
        }

        .orders-toolbar {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .orders-toolbar input {
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 8px;
            width: 280px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            color: #cbd5e1;
            min-width: 750px;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #263247;
        }

        th {
            color: #a78bfa;
            font-size: 13px;
        }

        td {
            font-size: 13px;
        }

        .back-link {
            color: #a78bfa;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="main-content">
        <header class="topbar">
            <div>
                <a href="index.html" class="back-link">← Back to Dashboard</a>
                <h1>Orders Management</h1>
                <p>Explore and monitor delivery orders.</p>
            </div>
        </header>

        <section class="orders-section">
            <h2>All Orders</h2>
            <p>Total Orders: <strong id="totalCount">Loading...</strong></p>

            <div class="orders-toolbar">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by order ID or city..."
                >
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Order Date</th>
                            <th>Weather</th>
                            <th>Traffic</th>
                            <th>City</th>
                            <th>Delivery Time</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTable">
                        <tr>
                            <td colspan="6">Loading orders...</td>
                        </tr>
                    </tbody>
                </table>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px; gap:15px;">
                    <button id="prevBtn" disabled
                        style="padding:10px 18px; background:#8b5cf6; color:white; border:0; border-radius:6px; cursor:pointer;">
                        ← Previous    
                    </button>
                    
                    <span id="pageInfo" style="color:#cbd5e1;">
                        Page 1 of 1
                    </span>

                    <button id="nextBtn"
                        style="padding:10px 18px; background:#8b5cf6; color:white; border:0; border-radius:6px; cursor:pointer;">
                        Next →
                    </button>
                </div>
            </div>
        </section>
    </div>

    <script src="orders.js"></script>
</body>
</html>
